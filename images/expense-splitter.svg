<svg width="600" height="380" viewBox="0 0 600 380" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#080808"/>
      <stop offset="100%" style="stop-color:#0f0f0f"/>
    </linearGradient>
    <linearGradient id="goldCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f0c355;stop-opacity:0.12"/>
      <stop offset="100%" style="stop-color:#f0c355;stop-opacity:0.04"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="600" height="380" fill="url(#bg)"/>
  <ellipse cx="300" cy="-10" rx="300" ry="120" fill="#f0c355" opacity="0.04"/>

  <!-- Navbar -->
  <rect width="600" height="44" fill="#0a0a0a"/>
  <rect y="44" width="600" height="1" fill="#ffffff" opacity="0.06"/>
  <text x="22" y="28" font-family="Georgia, serif" font-size="15" font-weight="700" fill="#f0c355">⚡ Splitter</text>
  <rect x="440" y="14" width="60" height="20" rx="10" fill="#181818" stroke="#ffffff" stroke-width="0.5" stroke-opacity="0.1"/>
  <text x="470" y="28" font-family="Arial" font-size="10" fill="#666" text-anchor="middle">Home</text>
  <rect x="510" y="14" width="74" height="20" rx="10" fill="#202020" stroke="#ffffff" stroke-width="0.5" stroke-opacity="0.15"/>
  <text x="547" y="28" font-family="Arial" font-size="10" fill="#ccc" text-anchor="middle">Dashboard</text>

  <!-- Title -->
  <text x="300" y="96" font-family="Georgia, serif" font-size="36" font-weight="700" fill="#efefef" text-anchor="middle" letter-spacing="-1">Expense</text>
  <text x="300" y="134" font-family="Georgia, serif" font-size="36" font-weight="700" fill="#f0c355" font-style="italic" text-anchor="middle" letter-spacing="-1">Splitter</text>

  <!-- 3 Stat Cards -->
  <rect x="22" y="152" width="170" height="60" rx="10" fill="#111" stroke="#ffffff" stroke-width="0.5" stroke-opacity="0.07"/>
  <text x="107" y="178" font-family="Georgia, serif" font-size="26" font-weight="700" fill="#f0c355" text-anchor="middle">5</text>
  <text x="107" y="198" font-family="Arial" font-size="9" fill="#555" text-anchor="middle" letter-spacing="2">GROUPS</text>

  <rect x="215" y="152" width="170" height="60" rx="10" fill="#111" stroke="#ffffff" stroke-width="0.5" stroke-opacity="0.07"/>
  <text x="300" y="178" font-family="Georgia, serif" font-size="26" font-weight="700" fill="#f0c355" text-anchor="middle">18</text>
  <text x="300" y="198" font-family="Arial" font-size="9" fill="#555" text-anchor="middle" letter-spacing="2">MEMBERS</text>

  <rect x="408" y="152" width="170" height="60" rx="10" fill="url(#goldCard)" stroke="#f0c355" stroke-width="0.5" stroke-opacity="0.3"/>
  <text x="493" y="178" font-family="Georgia, serif" font-size="26" font-weight="700" fill="#f0c355" text-anchor="middle">$840</text>
  <text x="493" y="198" font-family="Arial" font-size="9" fill="#888" text-anchor="middle" letter-spacing="2">TOTAL SPENT</text>

  <!-- Two columns -->
  <!-- Left: Expenses -->
  <rect x="22" y="226" width="270" height="140" rx="10" fill="#111" stroke="#ffffff" stroke-width="0.5" stroke-opacity="0.07"/>
  <text x="38" y="246" font-family="Arial" font-size="8" fill="#555" letter-spacing="2">RECENT EXPENSES</text>

  <rect x="30" y="254" width="254" height="28" rx="6" fill="#191919"/>
  <text x="42" y="273" font-family="Georgia, serif" font-size="13" font-weight="600" fill="#eee">Hotel Booking</text>
  <text x="272" y="273" font-family="Georgia, serif" font-size="14" font-weight="700" fill="#f0c355" text-anchor="end">$240</text>
  <text x="42" y="285" font-family="Arial" font-size="8" fill="#555">Mombasa Trip · Paid by Alice</text>

  <rect x="30" y="288" width="254" height="28" rx="6" fill="#191919"/>
  <text x="42" y="307" font-family="Georgia, serif" font-size="13" font-weight="600" fill="#eee">Dinner</text>
  <text x="272" y="307" font-family="Georgia, serif" font-size="14" font-weight="700" fill="#f0c355" text-anchor="end">$120</text>
  <text x="42" y="319" font-family="Arial" font-size="8" fill="#555">House Bills · Paid by Bob</text>

  <rect x="30" y="322" width="254" height="28" rx="6" fill="#191919"/>
  <text x="42" y="341" font-family="Georgia, serif" font-size="13" font-weight="600" fill="#eee">Fuel</text>
  <text x="272" y="341" font-family="Georgia, serif" font-size="14" font-weight="700" fill="#f0c355" text-anchor="end">$80</text>
  <text x="42" y="353" font-family="Arial" font-size="8" fill="#555">Road Trip · Paid by Carol</text>

  <!-- Right: Balances -->
  <rect x="308" y="226" width="270" height="140" rx="10" fill="#111" stroke="#ffffff" stroke-width="0.5" stroke-opacity="0.07"/>
  <text x="324" y="246" font-family="Arial" font-size="8" fill="#555" letter-spacing="2">BALANCES</text>

  <rect x="316" y="254" width="254" height="28" rx="6" fill="#3ecf73" fill-opacity="0.1"/>
  <text x="328" y="273" font-family="Arial" font-size="12" fill="#bbb">Alice</text>
  <text x="558" y="273" font-family="Georgia, serif" font-size="16" font-weight="700" fill="#3ecf73" text-anchor="end">+$160</text>

  <rect x="316" y="288" width="254" height="28" rx="6" fill="#f16060" fill-opacity="0.1"/>
  <text x="328" y="307" font-family="Arial" font-size="12" fill="#bbb">Bob</text>
  <text x="558" y="307" font-family="Georgia, serif" font-size="16" font-weight="700" fill="#f16060" text-anchor="end">-$80</text>

  <rect x="316" y="322" width="254" height="28" rx="6" fill="#f16060" fill-opacity="0.1"/>
  <text x="328" y="341" font-family="Arial" font-size="12" fill="#bbb">Carol</text>
  <text x="558" y="341" font-family="Georgia, serif" font-size="16" font-weight="700" fill="#f16060" text-anchor="end">-$80</text>
</svg>
