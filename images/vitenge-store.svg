    </linearGradient>
    <!-- Ankara pattern -->
    <pattern id="ankara" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <rect width="40" height="40" fill="#1a0a00"/>
      <circle cx="20" cy="20" r="8" fill="none" stroke="#e85d04" stroke-width="2"/>
      <circle cx="20" cy="20" r="4" fill="#f48c06"/>
      <circle cx="0" cy="0" r="4" fill="#e85d04" opacity="0.5"/>
      <circle cx="40" cy="0" r="4" fill="#e85d04" opacity="0.5"/>
      <circle cx="0" cy="40" r="4" fill="#e85d04" opacity="0.5"/>
      <circle cx="40" cy="40" r="4" fill="#e85d04" opacity="0.5"/>
      <line x1="0" y1="20" x2="12" y2="20" stroke="#f48c06" stroke-width="1.5" opacity="0.6"/>
      <line x1="28" y1="20" x2="40" y2="20" stroke="#f48c06" stroke-width="1.5" opacity="0.6"/>
